# Nightly builds. Mirrors the build matrix and build/signing steps of
# release.yml — keep cert/NDK/toolchain bumps, secret names, and the
# platform build/signing steps in sync between the two.
#
# Differences from release.yml: this workflow (1) stamps a nightly version
# `<base>-<YYYYMMDDHH>` (Asia/Shanghai), and (2) uploads build outputs as
# GitHub Actions Artifacts for manual testing. This temporary distribution path
# avoids requiring an R2 bucket before the first public release.
name: Nightly Readest

on:
  schedule:
    - cron: '0 22 * * *' # 22:00 UTC = 06:00 GMT+8
  workflow_dispatch:

permissions:
  contents: read

# Serialize runs so an older run cannot compete with a newer artifact upload.
# Do not cancel an in-flight build; keep its outputs available for inspection.
concurrency:
  group: nightly-readest
  cancel-in-progress: false

jobs:
  compute-version:
    runs-on: ubuntu-latest
    outputs:
      nightly_version: ${{ steps.v.outputs.nightly_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - id: v
        run: |
          BASE=$(node -p "require('./apps/readest-app/package.json').version")
          STAMP=$(TZ=Asia/Shanghai date +%Y%m%d%H)
          echo "nightly_version=${BASE}-${STAMP}" >> "$GITHUB_OUTPUT"

  build:
    needs: compute-version
    permissions:
      contents: read
      # Required by actions/attest-build-provenance: id-token mints the Sigstore
      # OIDC identity, attestations writes the provenance to the repo's store.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: ubuntu-latest
            release: android
            arch: universal
            rust_target: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
          - os: ubuntu-22.04
            release: linux
            arch: x86_64
            rust_target: x86_64-unknown-linux-gnu
            args: '--bundles deb,rpm,appimage'
          - os: ubuntu-22.04-arm
            release: linux
            arch: aarch64
            rust_target: aarch64-unknown-linux-gnu
            args: '--bundles deb,rpm,appimage'
          - os: windows-latest
            release: windows
            arch: x86_64
            rust_target: x86_64-pc-windows-msvc
            args: '--target x86_64-pc-windows-msvc --bundles nsis'
          - os: windows-latest
            release: windows
            arch: aarch64
            rust_target: aarch64-pc-windows-msvc
            args: '--target aarch64-pc-windows-msvc --bundles nsis'

    runs-on: ${{ matrix.config.os }}
    # Backstop only — must stay ABOVE setup time + the per-step timeouts below.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: initialize git submodules
        run: git submodule update --init --recursive

      - name: setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: setup Java (for Android build only)
        if: matrix.config.release == 'android'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: setup Android SDK (for Android build only)
        if: matrix.config.release == 'android'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: install NDK (for Android build only)
        if: matrix.config.release == 'android'
        run: sdkmanager "ndk;28.2.13676358"

      - name: install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: copy pdfjs-dist and simplecc-dist to public directory
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.config.rust_target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: nightly-${{ matrix.config.os }}-${{ matrix.config.release }}-${{ matrix.config.arch }}-cargo

      - name: install dependencies (ubuntu only)
        if: contains(matrix.config.os, 'ubuntu') && matrix.config.release != 'android'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libgtk-3-dev libwebkit2gtk-4.1 libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1 libjavascriptcoregtk-4.1-dev gir1.2-javascriptcoregtk-4.1 gir1.2-webkit2-4.1 libappindicator3-dev librsvg2-dev patchelf rpm xdg-utils

      - name: create .env.local file for Next.js
        run: |
          echo "NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}" >> .env.local
          echo "NEXT_PUBLIC_POSTHOG_HOST=${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> .env.local
          echo "NEXT_PUBLIC_APP_PLATFORM=tauri" >> .env.local
          echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" >> .env.local
          echo "SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}" >> .env.local
          echo "SENTRY_ORG=readest" >> .env.local
          echo "SENTRY_PROJECT=readest" >> .env.local
          cp .env.local apps/readest-app/.env.local

      # ──────────────────────────── ANDROID ────────────────────────────
      # `pnpm tauri android init` + `git checkout .` reverts tracked files
      # (including package.json), so the nightly version MUST be patched AFTER
      # the checkout. Mirrors release.yml's android build/signing steps.
      - name: build and sign Android apks
        if: matrix.config.release == 'android'
        shell: bash
        timeout-minutes: 55
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version="${{ needs.compute-version.outputs.nightly_version }}"
          cd apps/readest-app/
          rm -rf src-tauri/gen/android
          pnpm tauri android init
          pnpm tauri icon ../../data/icons/readest-book.png
          git checkout .
          # Patch the nightly version AFTER checkout so the stamp survives.
          node -e "const f='package.json';const j=require('./'+f);j.version='${version}';require('fs').writeFileSync(f, JSON.stringify(j,null,2)+'\n')"

          pushd src-tauri/gen/android
          printf 'keyAlias=%s\npassword=%s\nstoreFile=%s\n' \
            "$ANDROID_KEY_ALIAS" \
            "$ANDROID_KEY_PASSWORD" \
            "$RUNNER_TEMP/keystore.jks" > keystore.properties
          popd

          printf '%s' "$ANDROID_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore.jks"

          echo "Verifying Android keystore and alias..."
          test -s "$RUNNER_TEMP/keystore.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/keystore.jks" \
            -storepass "$ANDROID_KEY_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            >/dev/null
          echo "Android keystore alias verified."

          cp "$RUNNER_TEMP/keystore.jks" "$RUNNER_TEMP/keystore-verify.jks"
          keytool -keypasswd \
            -keystore "$RUNNER_TEMP/keystore-verify.jks" \
            -storepass "$ANDROID_KEY_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -new "$(openssl rand -hex 32)" \
            >/dev/null
          rm -f "$RUNNER_TEMP/keystore-verify.jks"
          echo "Android private-key password verified."

          apk_path=src-tauri/gen/android/app/build/outputs/apk/universal/release
          universal_apk=Readest_${version}_universal.apk
          arm64_apk=Readest_${version}_arm64.apk
          pnpm tauri android build
          cp ${apk_path}/app-universal-release.apk $universal_apk
          pnpm tauri signer sign $universal_apk
          pnpm tauri android build -t aarch64
          cp ${apk_path}/app-universal-release.apk $arm64_apk
          pnpm tauri signer sign $arm64_apk

      # ──────────────────────────── DESKTOP ────────────────────────────
      - name: install portable AppImage bundler (Linux)
        if: matrix.config.release == 'linux'
        # The branch tip re-downloads quick-sharun.sh on every build and can
        # hang indefinitely on GitHub-hosted Linux runners. This revision keeps
        # the cache check used by the previously passing builds.
        run: cargo install tauri-cli --git https://github.com/tauri-apps/tauri --rev 162626969b382d52faebdf6c7264460bd9a47d1f --force

      - name: pin AppImage runtime helper (Linux)
        if: matrix.config.release == 'linux'
        run: |
          set -euo pipefail
          cache_dir="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          mkdir -p "$cache_dir"
          curl -fsSL --retry 3 -o "$cache_dir/quick-sharun.sh" \
            "https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/b3a9e985cdedf7efa81d172f182cd13983743147/useful-tools/quick-sharun.sh"
          chmod +x "$cache_dir/quick-sharun.sh"

      - name: build desktop bundles
        if: matrix.config.release != 'android'
        shell: bash
        # A hung build must fail the STEP (step timeout -> job failure), not hit
        # the job-level timeout: job timeouts report `cancelled`, which the
        # package-artifacts guard treats as run cancellation and skips collecting
        # outputs for all platforms (#4906).
        timeout-minutes: 45
        env:
          TAURI_BUNDLER_NEW_APPIMAGE_FORMAT: 'true'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: |
          version="${{ needs.compute-version.outputs.nightly_version }}"
          node -e "const f='apps/readest-app/package.json';const j=require('./'+f);j.version='${version}';require('fs').writeFileSync(f, JSON.stringify(j,null,2)+'\n')"
          cd apps/readest-app
          if [ "${{ matrix.config.release }}" = "linux" ]; then
            cargo tauri build ${{ matrix.config.args }}
          else
            pnpm tauri build ${{ matrix.config.args }}
          fi

      # ─────────────────────── COLLECT ARTIFACTS ───────────────────────
      # Each leg copies its updater artifacts (+ .sig) into ./nightly-out.
      # They are uploaded below as GitHub Actions Artifacts for manual testing.
      - name: collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.compute-version.outputs.nightly_version }}"
          release="${{ matrix.config.release }}"
          out="$PWD/nightly-out"
          mkdir -p "$out"
          # Cargo WORKSPACE: bundles land in the REPO-ROOT target/ dir, not
          # apps/readest-app/src-tauri/target/ (matches release.yml line 371).
          bundle="target"

          # Stage one artifact and its .sig into $out.
          add_entry() {
            local src="$1"; local fname="$2"
            if [ ! -f "$src" ] || [ ! -f "${src}.sig" ]; then
              echo "::error::missing artifact or signature: $src"
              exit 1
            fi
            cp "$src" "$out/$fname"
            cp "${src}.sig" "$out/${fname}.sig"
            echo "staged $fname"
          }

          case "$release" in
            android)
              add_entry "apps/readest-app/Readest_${version}_universal.apk" "Readest_${version}_universal.apk"
              add_entry "apps/readest-app/Readest_${version}_arm64.apk" "Readest_${version}_arm64.apk"
              ;;
            linux)
              deb_dir="${bundle}/release/bundle/deb"
              mapfile -t debs < <(find "$deb_dir" -maxdepth 1 -type f -name '*.deb' ! -name '*.sig' -print)
              if [ "${#debs[@]}" -ne 1 ]; then
                echo "::error::expected exactly one Debian package in $deb_dir"
                printf '%s\n' "${debs[@]}"
                exit 1
              fi
              deb_path="${debs[0]}"
              deb_name="$(basename "$deb_path")"
              add_entry "$deb_path" "$deb_name"
              rpm_dir="${bundle}/release/bundle/rpm"
              mapfile -t rpms < <(find "$rpm_dir" -maxdepth 1 -type f -name '*.rpm' ! -name '*.sig' -print)
              if [ "${#rpms[@]}" -ne 1 ]; then
                echo "::error::expected exactly one RPM package in $rpm_dir"
                printf '%s\n' "${rpms[@]}"
                exit 1
              fi
              rpm_path="${rpms[0]}"
              rpm_name="$(basename "$rpm_path")"
              add_entry "$rpm_path" "$rpm_name"
              if [ "${{ matrix.config.arch }}" = "x86_64" ]; then
                appimage_name="Gratis Readest_${version}_amd64.AppImage"
              else
                appimage_name="Gratis Readest_${version}_aarch64.AppImage"
              fi
              add_entry "${bundle}/release/bundle/appimage/${appimage_name}" "$appimage_name"
              ;;
            windows)
              nsis_dir="target/${{ matrix.config.rust_target }}/release/bundle/nsis"
              mapfile -t installers < <(find "$nsis_dir" -maxdepth 1 -type f -name '*.exe' ! -name '*.sig' -print)
              if [ "${#installers[@]}" -ne 1 ]; then
                echo "::error::expected exactly one Windows installer in $nsis_dir"
                printf '%s\n' "${installers[@]}"
                exit 1
              fi
              installer_path="${installers[0]}"
              installer_name="$(basename "$installer_path")"
              add_entry "$installer_path" "$installer_name"
              ;;
            *)
              echo "::error::unknown release leg: $release"; exit 1
              ;;
          esac

      # Attest the distributable binaries staged in nightly-out. The .sig updater
      # signatures are excluded because they are not binaries users run.
      - name: attest nightly binaries
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            nightly-out/Readest*
            nightly-out/Gratis Readest*
            !nightly-out/*.sig

      - name: upload platform artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-${{ needs.compute-version.outputs.nightly_version }}-${{ matrix.config.release }}-${{ matrix.config.arch || 'all' }}
          path: nightly-out/*
          if-no-files-found: error
          retention-days: 14

  package-artifacts:
    needs: [compute-version, build]
    if: ${{ always() && needs.build.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: download platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: nightly-*
          path: nightly
          merge-multiple: true

      - name: create artifact manifest
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.compute-version.outputs.nightly_version }}"
          if ! compgen -G 'nightly/Readest*' > /dev/null \
            && ! compgen -G 'nightly/Gratis Readest*' > /dev/null; then
            echo "::error::no build outputs found"
            exit 1
          fi
          find nightly -maxdepth 1 -type f -printf '%f\n' | sort > nightly/FILES.txt
          {
            echo "Nightly version: ${version}"
            echo
            echo "Files:"
            sed 's/^/- /' nightly/FILES.txt
          } > nightly/README.txt

      - name: upload combined artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-${{ needs.compute-version.outputs.nightly_version }}-all
          path: nightly
          if-no-files-found: error
          retention-days: 14
