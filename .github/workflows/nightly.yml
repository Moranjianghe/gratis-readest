# Nightly builds. Mirrors the build matrix and build/signing steps of
# release.yml — keep cert/NDK/toolchain bumps, secret names, and the
# platform build/signing steps in sync between the two.
#
# Differences from release.yml: this workflow (1) stamps a nightly version
# `<base>-<YYYYMMDDHH>` (Asia/Shanghai), and (2) uploads build outputs as
# GitHub Actions Artifacts for manual testing. This distribution path does not
# require an R2 bucket.
name: Nightly Readest

on:
  schedule:
    - cron: '0 22 * * *' # 22:00 UTC = 06:00 GMT+8
  workflow_dispatch:

permissions:
  contents: read

# Serialize runs so an older run cannot compete with a newer artifact upload.
# Do not cancel an in-flight build; keep its outputs available for inspection.
concurrency:
  group: nightly-readest
  cancel-in-progress: false

jobs:
  compute-version:
    runs-on: ubuntu-latest
    outputs:
      nightly_version: ${{ steps.v.outputs.nightly_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A scheduled run uses the repository's default branch here; a
          # manually dispatched run must build the branch it was dispatched
          # from, otherwise the version stamp and frontend source can come
          # from different trees (e.g. the Popup black-corner fix).
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - id: v
        run: |
          BASE=$(node -p "require('./apps/readest-app/package.json').version")
          STAMP=$(TZ=Asia/Shanghai date +%Y%m%d%H)
          echo "nightly_version=${BASE}-${STAMP}" >> "$GITHUB_OUTPUT"

  build:
    needs: compute-version
    permissions:
      contents: read
      # Required by actions/attest-build-provenance: id-token mints the Sigstore
      # OIDC identity, attestations writes the provenance to the repo's store.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: ubuntu-latest
            release: android
            rust_target: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
          - os: ubuntu-22.04
            release: linux
            arch: x86_64
            rust_target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            release: linux
            arch: aarch64
            rust_target: aarch64-unknown-linux-gnu
          - os: windows-latest
            release: windows
            arch: x86_64
            rust_target: x86_64-pc-windows-msvc
            args: '--target x86_64-pc-windows-msvc --bundles nsis'
          - os: windows-latest
            release: windows
            arch: aarch64
            rust_target: aarch64-pc-windows-msvc
            args: '--target aarch64-pc-windows-msvc --bundles nsis'

    runs-on: ${{ matrix.config.os }}
    # Backstop only — must stay ABOVE setup time + the per-step timeouts below,
    # Backstop only — must stay ABOVE setup time + the per-step timeouts below.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: initialize git submodules
        run: git submodule update --init --recursive

      - name: setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: setup Java (for Android build only)
        if: matrix.config.release == 'android'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: setup Android SDK (for Android build only)
        if: matrix.config.release == 'android'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: install NDK (for Android build only)
        if: matrix.config.release == 'android'
        run: sdkmanager "ndk;28.2.13676358"

      - name: install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: copy pdfjs-dist and simplecc-dist to public directory
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.config.rust_target }}

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: nightly-${{ matrix.config.os }}-${{ matrix.config.release }}-${{ matrix.config.arch }}-cargo

      # The npm cli-cef bundles the AppImage with a broken quick-sharun fork
      # and cannot be pointed elsewhere. Build the CLI from readest/tauri
      # instead: its sharun_cef.rs pins pkgforge's deployment-array quoting
      # fix (Anylinux-AppImages#855) and runs the tooling with bash and
      # streamed output. Rev-pinned; the marker skips the rebuild while
      # rust-cache keeps ~/.cargo/bin. scripts/tauri.mjs runs `cargo tauri`
      # when TAURI_CEF_CARGO=1.
      - name: install the CEF tauri CLI from readest/tauri (linux only)
        if: matrix.config.release == 'linux'
        run: |
          set -euo pipefail
          rev=2b8315bd14882471b6567b1ceba84c0c0238f156
          marker="$HOME/.cargo/bin/.cargo-tauri-rev"
          if [ -x "$HOME/.cargo/bin/cargo-tauri" ] && [ "$(cat "$marker" 2>/dev/null)" = "$rev" ]; then
            echo "cargo-tauri at $rev already installed"
            exit 0
          fi
          cargo install tauri-cli --git https://github.com/readest/tauri --rev "$rev" --locked --force
          echo "$rev" > "$marker"

      - name: install dependencies (ubuntu only)
        if: contains(matrix.config.os, 'ubuntu') && matrix.config.release != 'android'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libgtk-3-dev libwebkit2gtk-4.1 libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1 libjavascriptcoregtk-4.1-dev gir1.2-javascriptcoregtk-4.1 gir1.2-webkit2-4.1 libappindicator3-dev librsvg2-dev patchelf xdg-utils

      # Chromium dlopens NSS, libpulse and libspeechd by soname; whatever the
      # bundle lacks comes from the host at run time and fails against the
      # bundled glibc on any newer distro (NSS: FATAL crypto/nss_util.cc).
      # quick-sharun's DEPLOY_CHROMIUM deploys NSS and, via DEPLOY_PIPEWIRE,
      # pulse — with the pinned pkgforge script the CLI above uses. Three gaps
      # remain, passed as appimage.files under /usr/lib, which the bundler
      # hands to quick-sharun as arguments: Debian keeps the NSS modules in
      # <triple>/nss/ where the Arch-layout globs miss them, and nothing
      # deploys libspeechd. winit dlopens libxkbcommon-x11 by soname when it
      # opens its X11 event loop (the CEF runtime forces X11 even on Wayland),
      # and quick-sharun's Chromium rule would deploy it, but the runner image
      # has no copy to deploy; without it every launch panics before the first
      # log line (#6144). The npm cli-cef could do none of this: its
      # quick-sharun fork drops the `eval` that rebuilds the deploy array
      # (FabianLars/Anylinux-AppImages@3e280d1b), so every DEPLOY_* extra is
      # silently skipped.
      - name: stage CEF AppImage runtime libraries (linux only)
        if: matrix.config.release == 'linux'
        run: |
          set -euo pipefail
          sudo apt-get install -y libnss3 libpulse0 libspeechd2 libxkbcommon-x11-0
          nss_dir=$(dirname "$(ls /usr/lib/*-linux-gnu/nss/libsoftokn3.so)")
          lib_dir=${nss_dir%/nss}
          sudo cp -f --remove-destination "$nss_dir"/*.so "$lib_dir/"
          # +=: tauri.conf.json already ships the AppRun hook entry.
          conf=apps/readest-app/src-tauri/tauri.conf.json
          jq --arg d "$lib_dir" '.bundle.linux.appimage.files += {
              "/usr/lib/libsoftokn3.so": ($d + "/libsoftokn3.so"),
              "/usr/lib/libfreeblpriv3.so": ($d + "/libfreeblpriv3.so"),
              "/usr/lib/libnssckbi.so": ($d + "/libnssckbi.so"),
              "/usr/lib/libspeechd.so.2": ($d + "/libspeechd.so.2"),
              "/usr/lib/libxkbcommon-x11.so.0": ($d + "/libxkbcommon-x11.so.0")
            }' "$conf" > "$conf.tmp" && mv "$conf.tmp" "$conf"

      - name: create .env.local file for Next.js
        run: |
          echo "NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}" >> .env.local
          echo "NEXT_PUBLIC_POSTHOG_HOST=${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> .env.local
          echo "NEXT_PUBLIC_APP_PLATFORM=tauri" >> .env.local
          echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" >> .env.local
          echo "SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}" >> .env.local
          echo "SENTRY_ORG=readest" >> .env.local
          echo "SENTRY_PROJECT=readest" >> .env.local
          cp .env.local apps/readest-app/.env.local

      # ──────────────────────────── ANDROID ────────────────────────────
      # `pnpm tauri android init` + `git checkout .` reverts tracked files
      # (including package.json), so the nightly version MUST be patched AFTER
      # the checkout. Mirrors release.yml's android build/signing steps.
      - name: build and sign Android apks
        if: matrix.config.release == 'android'
        shell: bash
        timeout-minutes: 55
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version="${{ needs.compute-version.outputs.nightly_version }}"
          cd apps/readest-app/
          rm -rf src-tauri/gen/android
          pnpm tauri android init
          pnpm tauri icon ../../data/icons/readest-book.png
          git checkout .
          # Patch the nightly version AFTER checkout so the stamp survives.
          node -e "const f='package.json';const j=require('./'+f);j.version='${version}';require('fs').writeFileSync(f, JSON.stringify(j,null,2)+'\n')"

          pushd src-tauri/gen/android
          printf 'keyAlias=%s\npassword=%s\nstoreFile=%s\n' \
            "$ANDROID_KEY_ALIAS" \
            "$ANDROID_KEY_PASSWORD" \
            "$RUNNER_TEMP/keystore.jks" > keystore.properties
          popd

          printf '%s' "$ANDROID_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore.jks"

          echo "Verifying Android keystore and alias..."
          test -s "$RUNNER_TEMP/keystore.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/keystore.jks" \
            -storepass "$ANDROID_KEY_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            >/dev/null
          echo "Android keystore alias verified."

          cp "$RUNNER_TEMP/keystore.jks" "$RUNNER_TEMP/keystore-verify.jks"
          keytool -keypasswd \
            -keystore "$RUNNER_TEMP/keystore-verify.jks" \
            -storepass "$ANDROID_KEY_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -new "$(openssl rand -hex 32)" \
            >/dev/null
          rm -f "$RUNNER_TEMP/keystore-verify.jks"
          echo "Android private-key password verified."

          apk_path=src-tauri/gen/android/app/build/outputs/apk/universal/release
          universal_apk=Readest_${version}_universal.apk
          arm64_apk=Readest_${version}_arm64.apk
          pnpm tauri android build
          cp ${apk_path}/app-universal-release.apk $universal_apk
          pnpm tauri signer sign $universal_apk
          pnpm tauri android build -t aarch64
          cp ${apk_path}/app-universal-release.apk $arm64_apk
          pnpm tauri signer sign $arm64_apk

      # ──────────────────────────── DESKTOP ────────────────────────────
      # Linux ships on the CEF runtime: `pnpm tauri` (mirrors release.yml; see
      # apps/readest-app/scripts/tauri.mjs) runs the feat/cef tauri CLI there.
      # The nightly version is patched BEFORE `tauri build` so the bundle
      # filenames carry the stamp.
      - name: build desktop bundles
        if: matrix.config.release != 'android'
        shell: bash
        # A hung build must fail the STEP (step timeout -> job failure), not hit
        # the job-level timeout: job timeouts report `cancelled`, which the
        # package-artifacts guard treats as run cancellation and skips collecting
        # outputs for all platforms (#4906).
        timeout-minutes: 45
        env:
          TAURI_CEF_CARGO: '1'
          # See release.yml.
          STRACE_MODE: '0'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: |
          version="${{ needs.compute-version.outputs.nightly_version }}"
          node -e "const f='apps/readest-app/package.json';const j=require('./'+f);j.version='${version}';require('fs').writeFileSync(f, JSON.stringify(j,null,2)+'\n')"
          cd apps/readest-app
          pnpm tauri build ${{ matrix.config.args }}

      # quick-sharun skips what it cannot find without failing; catch that
      # before it ships.
      - name: verify the AppImage bundle contents (linux only)
        if: matrix.config.release == 'linux'
        run: |
          set -euo pipefail
          appimage_dir=target/release/bundle/appimage
          mapfile -t app_dirs < <(find "$appimage_dir" -mindepth 1 -maxdepth 1 -type d -name '*.AppDir' -print)
          if [ "${#app_dirs[@]}" -ne 1 ]; then
            echo "::error::expected exactly one AppImage AppDir in $appimage_dir"
            printf '%s\n' "${app_dirs[@]}"
            exit 1
          fi
          lib="${app_dirs[0]}/lib"
          for so in libsoftokn3.so libfreeblpriv3.so libnssckbi.so libsqlite3.so.0 \
                    libpulse.so.0 libspeechd.so.2 libxkbcommon-x11.so.0; do
            [ -e "$lib/$so" ] || { echo "::error::$so is missing from the AppImage bundle"; exit 1; }
          done
          # libpulse finds its private half through a host RUNPATH; lib.path
          # has to cover the bundled copy for it to win.
          ls "$lib"/pulseaudio/libpulsecommon-*.so > /dev/null 2>&1 \
            || { echo "::error::libpulsecommon is missing from the AppImage bundle"; exit 1; }
          grep -qx '+/pulseaudio' "$lib/lib.path" \
            || { echo "::error::lib.path does not cover lib/pulseaudio, so libpulse cannot load"; exit 1; }
          # Without this hook every new AppImage asks for a root password.
          [ -e "${lib%/lib}/bin/00-no-userns-prompt.hook" ] \
            || { echo "::error::the no-userns-prompt hook is missing from the AppImage bundle"; exit 1; }

      # Portable Windows build: rebuild with NEXT_PUBLIC_PORTABLE_APP=true and
      # ship the raw exe (mirrors release.yml). Runs after the NSIS build above.
      - name: build and sign portable binaries (Windows only)
        if: matrix.config.os == 'windows-latest'
        shell: bash
        timeout-minutes: 30
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version="${{ needs.compute-version.outputs.nightly_version }}"
          arch="${{ matrix.config.arch }}"
          rust_target="${{ matrix.config.rust_target }}"

          # The clean NSIS build above produced one bundle/nsis/*-setup.exe (+
          # .sig). The portable rebuild below runs `tauri
          # build ... --bundles nsis` AGAIN with NEXT_PUBLIC_PORTABLE_APP=true,
          # which OVERWRITES that installer with a portable-flavored one. Stage
          # the clean installer + its updater .sig to a safe dir FIRST so the
          # collect step can read the untouched copy for the windows-* keys.
          nsis_dir="target/${rust_target}/release/bundle/nsis"
          mapfile -t installers < <(find "$nsis_dir" -maxdepth 1 -type f -name '*-setup.exe' ! -name '*.sig' -print)
          if [ "${#installers[@]}" -ne 1 ]; then
            echo "::error::expected exactly one Windows installer in $nsis_dir"
            printf '%s\n' "${installers[@]}"
            exit 1
          fi
          nsis_src="${installers[0]}"
          nsis_name="$(basename "$nsis_src")"
          mkdir -p nsis-staged
          cp "$nsis_src" "nsis-staged/${nsis_name}"
          cp "${nsis_src}.sig" "nsis-staged/${nsis_name}.sig"

          pushd apps/readest-app/
          echo "NEXT_PUBLIC_PORTABLE_APP=true" >> .env.local
          pnpm tauri build ${{ matrix.config.args }}
          popd

          if [ "$arch" = "x86_64" ]; then
            bin_file="Readest_${version}_x64-portable.exe"
          else
            bin_file="Readest_${version}_arm64-portable.exe"
          fi
          exe_file=$(find "target/${rust_target}/release" -maxdepth 1 -type f -iname '*.exe' -print -quit)
          [ -n "$exe_file" ] || { echo "::error::portable executable is missing"; exit 1; }
          # Browsers on Windows refuse to download zips containing exe files, so
          # ship the exe directly (matches release.yml).
          cp "$exe_file" "$bin_file"
          pushd apps/readest-app/
          pnpm tauri signer sign "../../$bin_file"
          popd

      # ─────────────────────── COLLECT ARTIFACTS ───────────────────────
      # Each leg copies its updater artifacts (+ .sig) into ./nightly-out.
      # They are uploaded below as GitHub Actions Artifacts for manual testing.
      - name: collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.compute-version.outputs.nightly_version }}"
          release="${{ matrix.config.release }}"
          arch="${{ matrix.config.arch }}"
          rust_target="${{ matrix.config.rust_target }}"
          out="$PWD/nightly-out"
          mkdir -p "$out"
          # Cargo WORKSPACE: bundles land in the REPO-ROOT target/ dir, not
          # apps/readest-app/src-tauri/target/ (matches release.yml line 371).
          bundle="target"

          # Stage one artifact and its .sig into $out.
          add_entry() {
            local src="$1"; local fname="$2"
            if [ ! -f "$src" ] || [ ! -f "${src}.sig" ]; then
              echo "::error::missing artifact or signature: $src"
              exit 1
            fi
            cp "$src" "$out/$fname"
            cp "${src}.sig" "$out/${fname}.sig"
            echo "staged $fname"
          }

          case "$release" in
            android)
              add_entry "apps/readest-app/Readest_${version}_universal.apk" "Readest_${version}_universal.apk"
              add_entry "apps/readest-app/Readest_${version}_arm64.apk" "Readest_${version}_arm64.apk"
              ;;
            windows)
              if [ "$arch" = "x86_64" ]; then
                portable_name="Readest_${version}_x64-portable.exe"
                nsis_key="windows-x86_64"; portable_key="windows-x86_64-portable"
              else
                portable_name="Readest_${version}_arm64-portable.exe"
                nsis_key="windows-aarch64"; portable_key="windows-aarch64-portable"
              fi
              mapfile -t staged_installers < <(find nsis-staged -maxdepth 1 -type f -name '*-setup.exe' ! -name '*.sig' -print)
              if [ "${#staged_installers[@]}" -ne 1 ]; then
                echo "::error::expected exactly one staged Windows installer"
                printf '%s\n' "${staged_installers[@]}"
                exit 1
              fi
              nsis_path="${staged_installers[0]}"
              nsis_name="$(basename "$nsis_path")"
              # Read the CLEAN NSIS installer staged before the portable rebuild
              # (the rebuild overwrites bundle/nsis/...-setup.exe). See the
              # "build and sign portable binaries" step.
              add_entry "nsis-staged/${nsis_name}" "$nsis_name"
              # Portable exe was copied + signed into the repo root above.
              add_entry "$portable_name" "$portable_name"
              ;;
            linux)
              # CEF (sharun) AppImage: discover the actual product filename so
              # upstream and Gratis branding cannot make this step drift.
              # The Linux leg builds with `pnpm tauri build` WITHOUT `--target`
              # (no matrix args), so cargo emits bundles under target/release/
              # (host-target default) — NOT target/<triple>/release/ like the
              # Windows legs, which DO pass `--target`. So there is no
              # ${rust_target} subdir here.
              appimage_dir="${bundle}/release/bundle/appimage"
              mapfile -t appimages < <(find "$appimage_dir" -maxdepth 1 -type f -name '*.AppImage' ! -name '*.sig' -print)
              if [ "${#appimages[@]}" -ne 1 ]; then
                echo "::error::expected exactly one AppImage in $appimage_dir"
                printf '%s\n' "${appimages[@]}"
                exit 1
              fi
              appimage_path="${appimages[0]}"
              appimage_name="$(basename "$appimage_path")"
              add_entry "$appimage_path" "$appimage_name"
              ;;
            *)
              echo "::error::unknown release leg: $release"; exit 1
              ;;
          esac

      # Attest the distributable binaries staged in nightly-out (apks, AppImage,
      # setup/portable exe). The .sig updater signatures are excluded because
      # they are not binaries users run.
      - name: attest nightly binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            nightly-out/Readest*
            nightly-out/Gratis*
            !nightly-out/*.sig

      - name: upload platform artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-${{ needs.compute-version.outputs.nightly_version }}-${{ matrix.config.release }}-${{ matrix.config.arch || 'all' }}
          path: nightly-out/*
          if-no-files-found: error
          retention-days: 14

  package-artifacts:
    needs: [compute-version, build]
    if: ${{ always() && needs.build.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: download platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: nightly-*
          path: nightly
          merge-multiple: true

      - name: create artifact manifest
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.compute-version.outputs.nightly_version }}"
          if ! compgen -G 'nightly/Readest*' > /dev/null \
            && ! compgen -G 'nightly/Gratis*' > /dev/null; then
            echo "::error::no build outputs found"
            exit 1
          fi
          find nightly -maxdepth 1 -type f -printf '%f\n' | sort > nightly/FILES.txt
          {
            echo "Nightly version: ${version}"
            echo
            echo "Files:"
            sed 's/^/- /' nightly/FILES.txt
          } > nightly/README.txt

      - name: upload combined artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-${{ needs.compute-version.outputs.nightly_version }}-all
          path: nightly
          if-no-files-found: error
          retention-days: 14
